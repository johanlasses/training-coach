[tool.pytest.ini_options]
pythonpath = ["training_coach"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["real_checkin: let page views start the daily check-in (tests/conftest.py stubs it otherwise)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Bugs only (pyflakes, syntax, bugbear). No formatter: the code is deliberately compact.
select = ["F", "E9", "B"]
ignore = ["B905"]
